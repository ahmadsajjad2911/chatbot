[project]
name = "openchat-backend"
version = "0.1.0"
description = "OpenChat backend API"
readme = "README.md"
authors = [
    { name = "ahmadsajjad2911", email = "ahmadsajjad3015616@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
openchat-backend = "openchat_backend:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
